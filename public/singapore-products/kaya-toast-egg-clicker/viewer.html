    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));

      attribute vec3 aNormal;
      attribute vec3 aColor;
      uniform vec3 uCenter;
      uniform vec3 uRight;
      uniform vec3 uUp;
