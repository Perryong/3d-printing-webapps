        vColor=clamp(aColor*light,0.0,1.0);
      }`;
    const fragmentSource=`precision mediump float; varying vec3 vColor; void main(){ gl_FragColor=vec4(vColor,1.0); }`;
    function shader(type,source){
      const s=gl.createShader(type); gl.shaderSource(s,source); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const program=gl.createProgram();
    gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));
    gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const lower=[Infinity,Infinity,Infinity], upper=[-Infinity,-Infinity,-Infinity];
    let triangleCount=0;
    for(const mesh of meshes){
      triangleCount+=mesh.triangles.length;
      for(const p of mesh.vertices) for(let j=0;j<3;j++){
        lower[j]=Math.min(lower[j],p[j]);upper[j]=Math.max(upper[j],p[j]);
      }
    }
    const center=lower.map((x,j)=>(x+upper[j])/2);
    const radius=Math.hypot(...upper.map((x,j)=>(x-lower[j])/2));
    if(!(radius>0) || !triangleCount) throw new Error('This model has no visible geometry.');
    const data=new Float32Array(triangleCount*27); let cursor=0;
    for(const mesh of meshes) for(const face of mesh.triangles){
      const [a,b,c]=face.map(i=>mesh.vertices[i]);
      const ab=b.map((x,j)=>x-a[j]),ac=c.map((x,j)=>x-a[j]);
      const normal=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
      const length=Math.hypot(...normal)||1;
      for(const p of [a,b,c]){
        data.set(p,cursor);cursor+=3;
        data.set(normal.map(x=>x/length),cursor);cursor+=3;
        data.set(mesh.color,cursor);cursor+=3;
      }
    }
    const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
    ['aPosition','aNormal','aColor'].forEach((name,i)=>{
      const loc=gl.getAttribLocation(program,name);
      if(loc<0) throw new Error('Missing shader attribute '+name);
      gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,i*12);
    });
    const uniforms={};
    for(const name of ['uCenter','uRight','uUp','uEye','uScale','uDepth']){
      uniforms[name]=gl.getUniformLocation(program,name);
      if(uniforms[name]===null) throw new Error('Missing shader uniform '+name);
    }
    gl.uniform3fv(uniforms.uCenter,center);gl.uniform1f(uniforms.uDepth,1/(radius*3));
    gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(0,0,0,0);
    let azimuth=0.65,elevation=0.58,zoom=1,frame=0;
    function draw(){
      frame=0;
      const rect=canvas.getBoundingClientRect();if(!rect.width || !rect.height) return;
      const ratio=Math.min(window.devicePixelRatio||1,2);
      const width=Math.max(1,Math.round(rect.width*ratio)),height=Math.max(1,Math.round(rect.height*ratio));
      if(canvas.width!==width || canvas.height!==height){canvas.width=width;canvas.height=height;}
      gl.viewport(0,0,width,height);
      const sa=Math.sin(azimuth),ca=Math.cos(azimuth),se=Math.sin(elevation),ce=Math.cos(elevation);
      gl.uniform3fv(uniforms.uRight,[ca,sa,0]);
      gl.uniform3fv(uniforms.uUp,[-sa*se,ca*se,ce]);
      gl.uniform3fv(uniforms.uEye,[sa*ce,-ca*ce,se]);
      const aspect=width/height,half=radius*1.08/zoom;
      gl.uniform2f(uniforms.uScale,1/(half*Math.max(1,aspect)),1/(half*Math.max(1,1/aspect)));
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES,0,triangleCount*3);
      root.dataset.view=[azimuth,elevation,zoom].map(x=>x.toFixed(4)).join(',');
    }
    function requestDraw(){if(!frame) frame=requestAnimationFrame(draw);}
    function changeZoom(factor){zoom=Math.max(.65,Math.min(3.6,zoom*factor));requestDraw();}
    root.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{
      const preset=button.dataset.view;
      [azimuth,elevation]=preset==='front'?[0,0]:preset==='top'?[0,Math.PI/2]:[.65,.58];
      zoom=1;requestDraw();
    }));
    root.querySelectorAll('[data-zoom]').forEach(button=>button.addEventListener('click',()=>changeZoom(Number(button.dataset.zoom))));
    let drag=null;
    canvas.addEventListener('pointerdown',event=>{
      if(event.button!==0) return;
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event=>{
      if(!drag || event.pointerId!==drag.id) return;
      azimuth-=(event.clientX-drag.x)*.009;
      elevation=Math.max(-Math.PI/2,Math.min(Math.PI/2,elevation+(event.clientY-drag.y)*.009));
      drag.x=event.clientX;drag.y=event.clientY;requestDraw();
    });
    function stopDrag(){drag=null;}
    canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);canvas.addEventListener('lostpointercapture',stopDrag);
    canvas.addEventListener('wheel',event=>{
      event.preventDefault();
      const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?320:1);
      changeZoom(Math.exp(-Math.max(-120,Math.min(120,delta))*.002));
    },{passive:false});
    canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();status.hidden=false;status.textContent='3D preview paused. Reopen this page to restore it.';});
    new ResizeObserver(requestDraw).observe(canvas);
    status.hidden=true;root.dataset.ready='true';requestDraw();
  } catch(error){
    status.hidden=false;status.textContent=error.message.includes('3D preview')?error.message:'The 3D preview could not load in this browser.';
    root.dataset.error=String(error.message);
    root.querySelectorAll('button').forEach(button=>button.disabled=true);
  }
})();
</script>
</body></html>
